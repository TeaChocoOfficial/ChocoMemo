<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="chocBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#582f0e"/>
      <stop offset="50%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#26140a"/>
    </linearGradient>

    <linearGradient id="chocBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f4f24"/>
      <stop offset="100%" stop-color="#432818"/>
    </linearGradient>

    <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGrad)"/>
  
  <circle cx="400" cy="400" r="360" fill="none" stroke="url(#goldRibbon)" stroke-width="2" opacity="0.3" stroke-dasharray="8 8"/>

  <g filter="url(#shadow)">
    <!-- OPEN BOOK COVER & PAGES -->
    <path d="M 140,540 Q 400,600 660,540 L 670,440 Q 400,500 130,440 Z" fill="url(#bookCoverGrad)" />
    <path d="M 150,510 Q 390,560 395,430 L 395,290 Q 380,410 160,400 Z" fill="url(#pageLeftGrad)"/>
    <path d="M 650,510 Q 410,560 405,430 L 405,290 Q 420,410 640,400 Z" fill="url(#pageRightGrad)"/>

    <!-- LANGUAGE SYMBOLS ON PAGE -->
    <text x="440" y="445" font-family="sans-serif" font-weight="bold" font-size="22" fill="#3b82f6" opacity="0.8">A B C</text>
    <text x="530" y="443" font-family="sans-serif" font-weight="bold" font-size="18" fill="#10b981" opacity="0.8">ก ข ค</text>
    <text x="450" y="480" font-family="sans-serif" font-weight="bold" font-size="20" fill="#ec4899" opacity="0.8">Bonjour</text>
    <text x="540" y="505" font-family="sans-serif" font-weight="bold" font-size="22" fill="#f59e0b" opacity="0.8">你好</text>

    <!-- CHOCOLATE BAR WITH FOIL WRAPPER -->
    <g transform="translate(400, 310) rotate(-12) translate(-170, -110)">
      <rect x="50" y="40" width="240" height="150" rx="12" fill="url(#chocBaseGrad)" filter="url(#shadow)"/>
      <rect x="65" y="53" width="65" height="38" rx="6" fill="url(#chocBlockGrad)" stroke="#26140a" stroke-width="2"/>
      <rect x="138" y="53" width="65" height="38" rx="6" fill="url(#chocBlockGrad)" stroke="#26140a" stroke-width="2"/>
      <rect x="211" y="53" width="65" height="38" rx="6" fill="url(#chocBlockGrad)" stroke="#26140a" stroke-width="2"/>
      <rect x="65" y="96" width="65" height="38" rx="6" fill="url(#chocBlockGrad)" stroke="#26140a" stroke-width="2"/>
      <rect x="138" y="96" width="65" height="38" rx="6" fill="url(#chocBlockGrad)" stroke="#26140a" stroke-width="2"/>
      <rect x="211" y="96" width="65" height="38" rx="6" fill="url(#chocBlockGrad)" stroke="#26140a" stroke-width="2"/>
      
      <!-- Foil & Wrapper -->
      <path d="M 30,30 L 150,30 L 170,75 L 140,195 L 30,195 Z" fill="url(#foilGrad)" opacity="0.9"/>
      <path d="M 15,20 L 135,20 L 115,205 L 15,205 Z" fill="url(#wrapperGrad)"/>
      <rect x="15" y="75" width="112" height="50" fill="url(#goldRibbon)"/>
      <text x="71" y="107" font-family="sans-serif" font-weight="900" font-size="16" fill="#432818" text-anchor="middle">SWEET</text>
      <text x="71" y="120" font-family="sans-serif" font-weight="700" font-size="9" fill="#432818" text-anchor="middle">LANGUAGES</text>
    </g>

    <!-- SPARKS & STARS -->
    <path d="M 230,260 Q 230,280 210,280 Q 230,280 230,300 Q 230,280 250,280 Q 230,280 230,260" fill="#fbbf24" filter="url(#glow)"/>
    <path d="M 590,240 Q 590,255 575,255 Q 590,255 590,270 Q 590,255 605,255 Q 590,255 590,240" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- BRAND TEXT -->
  <g text-anchor="middle">
    <text x="400" y="670" font-family="sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="2">
      CHOCO <tspan fill="#f59e0b">LANGUAGE</tspan>
    </text>
    <text x="400" y="715" font-family="sans-serif" font-weight="500" font-size="22" fill="#94a3b8" letter-spacing="4">
      เรียนภาษาสนุก อร่อย ครบทุกคำ
    </text>
  </g>
</svg>
