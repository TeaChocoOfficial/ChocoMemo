<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 75 600 600" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>



    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="chocBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#582f0e" />
      <stop offset="50%" stop-color="#3d2314" />
      <stop offset="100%" stop-color="#26140a" />
    </linearGradient>

    <linearGradient id="chocBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f4f24" />
      <stop offset="100%" stop-color="#432818" />
    </linearGradient>

    <linearGradient id="wrapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- OPEN BOOK COVER & PAGES -->
    <path d="M 140,540 Q 400,600 660,540 L 670,440 Q 400,500 130,440 Z" fill="url(#bookCoverGrad)" />
    <path d="M 150,510 Q 390,560 395,430 L 395,290 Q 380,410 160,400 Z" fill="url(#pageLeftGrad)" />
    <path d="M 650,510 Q 410,560 405,430 L 405,290 Q 420,410 640,400 Z" fill="url(#pageRightGrad)" />


    <!-- CHOCOLATE BAR WITH FOIL WRAPPER -->
    <g transform="translate(430, 340) rotate(-12) translate(-170, -110)">

      <!-- Base shadow -->
      <rect x="20" y="35" width="260" height="160" rx="15" fill="#2d150b" />
      <!-- Base chocolate -->
      <rect x="20" y="35" width="260" height="155" rx="15" fill="#4a2512" />

      <!-- Chocolate pieces shadow/mid-tone -->
      <g fill="#613318">
        <rect x="156" y="50" width="48" height="55" rx="8" />
        <rect x="214" y="50" width="48" height="55" rx="8" />

        <rect x="156" y="115" width="48" height="55" rx="8" />
        <rect x="214" y="115" width="48" height="55" rx="8" />
      </g>

      <!-- Chocolate pieces highlights -->
      <g fill="#7d4320">
        <rect x="161" y="55" width="38" height="45" rx="4" />
        <rect x="219" y="55" width="38" height="45" rx="4" />

        <rect x="161" y="120" width="38" height="45" rx="4" />
        <rect x="219" y="120" width="38" height="45" rx="4" />
      </g>

      <!-- Foil & Wrapper -->
      <path d="M 30,30 L 150,30 L 170,75 L 140,195 L 30,195 Z" fill="url(#foilGrad)" opacity="0.9" />
      <path d="M 15,20 L 135,20 L 115,205 L 15,205 Z" fill="url(#wrapperGrad)" />
      <rect x="15" y="75" width="112" height="50" fill="url(#goldRibbon)" />
      <g transform="translate(180, 40) rotate(90)">
        <text x="71" y="107" font-family="sans-serif" font-weight="900" font-size="32" fill="#432818"
          text-anchor="middle">CHOCO</text>
        <text x="71" y="125" font-family="sans-serif" font-weight="700" font-size="16" fill="#432818"
          text-anchor="middle">LANGUAGES</text>
      </g>
    </g>

    <!-- SPARKS & STARS -->
    <path d="M 230,260 Q 230,280 210,280 Q 230,280 230,300 Q 230,280 250,280 Q 230,280 230,260" fill="#fbbf24"
      filter="url(#glow)" />
    <path d="M 590,240 Q 590,255 575,255 Q 590,255 590,270 Q 590,255 605,255 Q 590,255 590,240" fill="#fbbf24"
      filter="url(#glow)" />
  </g>

</svg>