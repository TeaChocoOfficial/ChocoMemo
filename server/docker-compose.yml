# -Path: "Nest TypeScript/docker-compose.yml"
services:
    server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: nest-typescript-server
        volumes:
            - .:/usr/src/app
            - /usr/src/app/node_modules
        ports:
            - 3001:3001
        env_file:
            - ./.env
        environment:
            - SERVER_HOST=0.0.0.0
            - MONGODB_URI=mongodb://admin:secret123@mongodb:27017/database?authSource=admin
            - NODE_ENV=development
            - WATCHPACK_POLLING=true
            - CHOKIDAR_USEPOLLING=true
            - CHOKIDAR_INTERVAL=1000
        networks:
            - nest-typescript-network

    mongodb:
        image: mongo:7
        container_name: nest-typescript-mongodb
        restart: unless-stopped
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: admin
            MONGO_INITDB_ROOT_PASSWORD: secret123
        volumes:
            - mongodb_data:/data/db
        networks:
            - nest-typescript-network

volumes:
    mongodb_data:

networks:
    nest-typescript-network:
        driver: bridge